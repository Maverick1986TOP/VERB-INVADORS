<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-AGENTER GÅET ROGUE I LSC!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#05030f;--ink:#e9f7ff;--neon:#39ff88;--pink:#ff3df2;--cyan:#33e1ff;--amber:#ffd23f;--red:#ff4d5e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;justify-content:space-between;gap:8px;padding:10px 14px 6px;font-size:11px;line-height:1.6;color:var(--amber);text-shadow:0 0 6px currentColor}
#hud i{font-style:normal;color:var(--ink);text-shadow:none}
#lv{color:var(--red)}
#bar{height:8px;margin:0 14px 4px;border:1px solid var(--cyan)}#fill{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 6px var(--neon)}
#msg{height:16px;padding:0 14px;font-size:10px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.good{color:var(--neon)}#msg.bad{color:var(--red)}
#stage{position:relative;flex:1;min-height:0;border-top:3px solid var(--cyan);box-shadow:0 -2px 12px var(--cyan)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;image-rendering:pixelated}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
#ov{position:absolute;inset:0;z-index:2;display:flex;overflow:auto;padding:14px;background:rgba(5,3,15,.78)}
#card{margin:auto;max-width:420px;border:4px solid var(--neon);box-shadow:0 0 18px var(--neon);background:var(--bg);padding:22px}
#card h1{margin:0 0 16px;font-size:16px;line-height:1.3;color:var(--neon);text-shadow:0 0 8px var(--neon)}
#card p{margin:0 0 14px;font-size:10px;line-height:1.9}
.v{color:var(--neon)}.n{color:var(--red)}
kbd{font:inherit;display:inline-block;min-width:22px;text-align:center;padding:4px 6px;margin:2px 0;border:2px solid var(--cyan);color:var(--cyan);box-shadow:2px 2px 0 var(--pink)}
button{font:inherit;font-size:12px;color:var(--bg);background:var(--amber);border:0;padding:14px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--pink)}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--pink)}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#mute{position:absolute;z-index:3;top:10px;right:10px;padding:6px 10px;font-size:12px;box-shadow:2px 2px 0 var(--pink)}
#fire{display:none;position:absolute;z-index:1;right:12px;bottom:12px;width:76px;height:76px;border-radius:50%;padding:0;font-size:10px}
@media (pointer:coarse){#fire{display:block}}
</style>
</head>
<body>
<div id="hud"><span>SCORE <i id="sc">000000</i></span><span>HI <i id="hi">000000</i></span><span>BANE <i id="rd">1</i></span><span id="lv"></span></div>
<div id="bar"><b id="fill"></b></div>
<div id="msg"></div>
<div id="stage">
<canvas id="c" aria-label="Spilområde"></canvas>
<button id="mute" type="button" aria-label="Lyd til/fra">♪</button>
<button id="fire" type="button" aria-label="Skyd">SKYD</button>
<div id="ov"><div id="card"></div></div>
</div>
<script>
const VERBS="tænker genererer analyserer forudsiger beregner finder hører husker kontrollerer optimerer klassificerer forstår søger sorterer programmerer simulerer gætter vælger".split(" ");
const PAST="tænkte genererede analyserede forudsagde beregnede fandt hørte huskede kontrollerede optimerede klassificerede forstod søgte sorterede programmerede simulerede gættede valgte".split(" ");
const PART="tænkt genereret analyseret forudsagt beregnet fundet hørt husket kontrolleret optimeret klassificeret forstået søgt sorteret programmeret simuleret gættet valgt".split(" ");
const ADJ="intelligent hurtig kunstig digital automatisk smart præcis kreativ avanceret farlig nyttig stærk klog nøjagtig selvstændig usynlig uhyggelig genial".split(" ");
const ADJ_ER="sikker lækker bitter dyster tapper mager sober".split(" ");
const ADJ_E="smarte berømte forbudte kolde snedige stærke farlige vilde".split(" ");
const ADJ_T="hurtigt farligt præcist mørkt stærkt kunstigt digitalt tydeligt vildt nyt smukt".split(" ");
const KIND={};[[VERBS,"et nutidsverbum"],[PAST,"et datidsverbum"],[PART,"en kort tillægsform"],[ADJ.concat(ADJ_ER,ADJ_E,ADJ_T),"et adjektiv"]].forEach(([l,k])=>l.forEach(w=>KIND[w]=k));
const CFG=[0,
 {name:"FIREWALL",good:VERBS,bad:ADJ.slice(0,8).concat(ADJ_ER),goal:"skyd nutidsverber"},
 {name:"DATAREGNEN",good:VERBS,bad:PAST.concat(ADJ_E),goal:"skyd nutidsverber, ikke datid",brief:"<b>BANE 2: DATAREGNEN.</b> Firewallen er brudt! Agenterne gemmer sig i kodens regn. Skyd <span class=v>nutidsverber</span> (tænker). Skyd ikke <span class=n>datidsverber</span> (tænkte). Pas på adjektiver som <i>smarte</i>: kig på endelsen!"},
 {name:"SCANNINGEN",good:PART,bad:VERBS.concat(PAST,ADJ_T),goal:"skyd kort tillægsform",brief:"<b>BANE 3: SCANNINGEN.</b> Agenterne scanner dig, og de er onde! Skyd <span class=v>kort tillægsform</span> (tænkt). Skyd hverken nutids- eller datidsverber. Pas på <i>hurtigt</i>: kig på endelsen!"},
 {name:"MAIN FRAME",good:VERBS.concat(PAST,PART),bad:ADJ_ER.concat(ADJ_E,ADJ_T,ADJ.slice(0,6)),goal:"skyd alle verber",brief:"<b>BANE 4: MAIN FRAME.</b> Sidste chance! Skyd <span class=v>alle verber</span> i alle former. Skyd ikke <span class=n>adjektiver</span>. Pas på <i>sikker</i> og <i>smarte</i>!"}];
let space=true;
const HEAD=["..XXXXXXX..",".XXXXXXXXX.","XXEEXXXEEXX","XXEEXXXEEXX","XXXXXXXXXXX","XX.X.X.X.XX",".XXXXXXXXX.","..X.....X.."];
const SHIP=["......X......",".....XXX.....","..XXXXXXXXX..",".XXXXXXXXXXX.","XXXXXXXXXXXXX"];
const COLS=["#39ff88","#ff3df2","#33e1ff"];
const FONT="12px 'Press Start 2P',ui-monospace,monospace";
const $=id=>document.getElementById(id);
const cv=$("c"),ctx=cv.getContext("2d"),ov=$("ov"),card=$("card");
let W=0,H=0,px=0,bots=[],glows=[],shots=[],parts=[],stars=[],keys={};
let score=0,lives=3,round=1,running=false,last=0,spawn=0,cool=0,best=0,shake=0,T=0;
try{best=+localStorage.getItem("skyd-best")||0}catch(e){}

let AC;
function beep(f,d,type,v){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f/3),t+d);
  g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}

/* ---------- Musik: syntetiseret, dyster og dystopisk ---------- */
let MG,musicT=null,mstep=0,mnext=0,mk=-1,muted=false;
const mf=m=>440*Math.pow(2,(m-69)/12),P=s=>s.split(" ").map(Number);
const TH=[
 {bpm:72,bass:"36 0 0 0 0 0 0 0 34 0 0 0 0 0 0 0",bd:1.6,bt:"sawtooth",blp:260,lead:"0 0 0 0 0 0 0 0 63 0 0 0 0 0 0 0",ld:1.5,lt:"sine",lv:.05,llp:0,kick:"1000000010000000",hat:"0000000000000000",clang:"0000000000100000",tr:[0,0,-2,-4]},
 {bpm:96,bass:"33 0 0 33 0 0 33 0 31 0 0 31 0 0 31 0",bd:.25,bt:"square",blp:500,lead:"81 0 0 76 0 0 0 79 0 0 84 0 0 0 76 0",ld:.09,lt:"square",lv:.03,llp:3000,kick:"1000001000100000",hat:"0010001000100010",clang:"0000000000000000",tr:[0,-2,-4,-5]},
 {bpm:124,bass:"28 28 28 28 28 28 28 28 28 28 28 28 26 26 31 31",bd:.12,bt:"sawtooth",blp:700,lead:"64 67 71 74 76 74 71 67 64 67 71 74 76 74 71 67",ld:.1,lt:"sawtooth",lv:.035,llp:2200,kick:"1000100010001000",hat:"0010001000100010",clang:"0000000000000000",tr:[0,0,-2,-4]},
 {bpm:100,bass:"36 0 0 36 0 0 39 0 36 0 0 36 0 34 0 0",bd:.3,bt:"sawtooth",blp:400,lead:"75 0 0 0 0 0 0 0 0 0 74 0 0 0 0 0",ld:1.2,lt:"square",lv:.035,llp:900,kick:"1000001010001000",hat:"0000000000000000",clang:"0000100000001000",tr:[0,0,-2,1]},
 {bpm:108,bass:"33 0 0 0 0 0 0 0 29 0 0 0 0 0 0 0",bd:1.6,bt:"sine",blp:0,lead:"69 0 76 0 72 0 81 0 69 0 74 0 71 0 79 0",ld:.9,lt:"sine",lv:.05,llp:0,kick:"1000000010000000",hat:"0000100000001000",clang:"0000000000000000",tr:[0,0,-2,-5]}
];
TH.forEach(h=>{h.bass=P(h.bass);h.lead=P(h.lead)});
function actx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}
function tone(f,t,d,type,v,lp){const o=AC.createOscillator(),g=AC.createGain();let n=o;o.type=type;o.frequency.value=f;
  if(lp){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;o.connect(fl);n=fl}
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function kick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.27)}
function noise(t,d,v,fq){const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=fq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t)}
function mstepPlay(h,i,t,bar){
  const tr=h.tr[bar%4],b=h.bass[i],l=h.lead[i];
  if(b)tone(mf(b+tr),t,h.bd,h.bt,.1,h.blp);
  if(l)tone(mf(l+tr),t,h.ld,h.lt,h.lv,h.llp);
  if(h.kick[i]==="1")kick(t,.25);
  if(h.hat[i]==="1")noise(t,.05,.06,7000);
  if(h.clang[i]==="1"){noise(t,.3,.14,1800);tone(180,t,.25,"square",.05,900)}
}
function mtick(){const h=TH[mk];while(mnext<AC.currentTime+.15){mstepPlay(h,mstep%16,mnext,Math.floor(mstep/16));mnext+=60/h.bpm/4;mstep++}}
function stopMusic(){clearInterval(musicT);musicT=null;mk=-1}
function music(k){
  if(k===mk&&musicT)return;stopMusic();
  try{actx();if(!MG){MG=AC.createGain();MG.connect(AC.destination)}MG.gain.value=muted?0:.5;mk=k;mstep=0;mnext=AC.currentTime+.1;musicT=setInterval(mtick,30)}catch(e){}
}
function toggleMute(){muted=!muted;if(MG)MG.gain.value=muted?0:.5;$("mute").textContent=muted?"✕":"♪";
  if(!muted&&!musicT)music(space?0:Math.min(round,4))}

function resize(){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  W=Math.max(280,r.width);H=Math.max(300,r.height);
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  px=running?Math.max(30,Math.min(W-30,px)):W/2;
  stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.2?3:2,v:10+Math.random()*40}));
}
addEventListener("resize",resize);

const pad=n=>String(n).padStart(6,"0");
function hud(text,cls){$("sc").textContent=pad(score);$("hi").textContent=pad(Math.max(best,score));$("rd").textContent=round;$("fill").style.width=Math.max(0,Math.min(100,(score-(round-1)*200)/2))+"%";
  $("lv").textContent="♥".repeat(Math.max(0,lives));
  if(text!==undefined){const m=$("msg");m.textContent=text;m.className=cls||""}}
function show(html,label,fn){
  card.innerHTML=html+'<button id="go" type="button">'+label+'</button>';
  ov.style.display="flex";$("go").focus();$("go").onclick=()=>{ov.style.display="none";beep(660,.15);fn()};
}
function intro(){
  show('<h1>AI-AGENTER GÅET ROGUE I LSC!</h1><p>Onde AI-Agenter har invaderet Læse- og Skrivecentrets <span class="v">MAIN FRAME</span>. De har fordærvet smukke adjektiver til nutidsverber! <span class="v">SKYD DEM!</span></p><p>Skyd ikke de <span class="n">smukke adjektiver</span>. Nå 200 point for at bryde ind til <b>MAIN FRAME</b> – så du ikke skal arbejde for evigt.</p><p>Pas på! Nogle adjektiver ligner verber. Kig på endelserne. Slipper for mange verber igennem, går der rod i MAIN FRAMEN, og din tidsregistrering i Ludus slettes for altid!</p><p>Flyt: tryk på piletasterne <kbd>←</kbd> <kbd>→</kbd><br>Skyd: tryk på space <kbd>␣</kbd><br>Lyd: tryk på <kbd>M</kbd></p>',"START",()=>newGame());
}
function newGame(){score=0;lives=3;round=1;begin()}
function begin(){space=false;theme();music(Math.min(round,4));bots=[];shots=[];parts=[];glows=[];spawn=0;px=W/2;running=true;last=performance.now();hud("Bane "+round+": "+CFG[round].name+" - "+CFG[round].goal)}

function spawnBot(){
  const c=CFG[round],t0=Math.random()<.55,list=t0?c.good:c.bad;
  bots.push({t:list[Math.random()*list.length|0],isV:t0,w:60,bx:40+Math.random()*(W-80),x:0,y:-40,vy:48+round*20+Math.random()*28,ph:Math.random()*6,col:pal().bot});
}
function fire(){if(!running||cool>0)return;shots.push({x:px,y:H-58});cool=.25;beep(880,.12)}
function boom(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*160;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,c:col})}}

function update(dt){
  T+=dt;
  if(keys.ArrowLeft||keys.a)px-=380*dt;
  if(keys.ArrowRight||keys.d)px+=380*dt;
  px=Math.max(30,Math.min(W-30,px));
  if(keys[" "])fire();
  cool-=dt;spawn-=dt;shake=Math.max(0,shake-dt*20);
  if(spawn<=0){spawnBot();spawn=Math.max(.6,1.6-round*.16)}
  ctx.font=FONT;
  for(const b of bots){b.y+=(b.mode==="dust"?0:b.mode?70:b.vy)*dt;b.w=Math.max(56,ctx.measureText(b.t).width+20);
    b.x=Math.max(b.w/2,Math.min(W-b.w/2,b.bx+Math.sin(T*1.6+b.ph)*26))}
  shots.forEach(s=>s.y-=640*dt);
  for(const s of shots)for(const b of bots){
    if(!b.dead&&!b.mode&&!s.dead&&Math.abs(s.x-b.x)<b.w/2&&s.y>b.y-34&&s.y<b.y+34){
      s.dead=b.dead=true;
      if(b.isV){score+=10;boom(b.x,b.y,b.col,22);beep(300,.25,"sawtooth",.05);hud('Rigtigt! "'+b.t+'" er '+KIND[b.t],"good")}
      else{score=Math.max(0,score-10);shake=6;boom(b.x,b.y,"#ff4d5e",22);beep(120,.35,"sawtooth",.06);hud('Nej! "'+b.t+'" er '+KIND[b.t],"bad")}
    }
  }
  shots=shots.filter(s=>!s.dead&&s.y>-10);
  for(const b of bots){
    if(!b.dead&&!b.mode&&b.y>H-96){
      b.mode=b.isV?"breach":"dust";b.m=0;
      if(b.isV){lives--;shake=8;beep(80,.7,"sawtooth",.06);glows.push({x:b.x,l:2});
        hud('Ordet "'+b.t+'" slap igennem! '+(lives===0?"SIDSTE ADVARSEL! Ét mere, og din tidsregistrering i Ludus er væk!":"Din tidsregistrering i Ludus er i fare!"),"bad")}
      else beep(1400,.3,"triangle",.03);
    }
    if(b.mode){b.m+=dt;
      if(b.mode==="dust"){
        for(let i=0;i<5;i++)parts.push({x:b.x+(Math.random()-.5)*b.w,y:b.y-30+Math.random()*60,vx:(Math.random()-.5)*40,vy:-15-Math.random()*45,l:.8+Math.random()*.8,c:"#ffd23f"});
        if(b.m>.9)b.dead=true;
      }else{
        if(Math.random()<.6)parts.push({x:b.x+(Math.random()-.5)*50,y:H-22,vx:(Math.random()-.5)*50,vy:-40-Math.random()*60,l:.6,c:"#ff4d5e"});
        if(b.y>H+20)b.dead=true;
      }
    }
  }
  glows.forEach(g=>g.l-=dt);glows=glows.filter(g=>g.l>0);
  bots=bots.filter(b=>!b.dead);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
  hud();
  if(lives<0&&running)return over();
  if(score>=round*200&&running)return roundDone();
}
function roundDone(){
  running=false;music(0);beep(1000,.4,"triangle",.06);
  if(score>best){best=score;try{localStorage.setItem("skyd-best",best)}catch(e){}}
  if(round>=4)return show('<h1>MAIN FRAME REDDET!</h1><p>Du har besejret AI-Agenterne og klaret alle fire baner!</p><p>Score: '+pad(score)+'</p>',"SPIL IGEN",()=>newGame());
  show('<h1>TILLYKKE!</h1><p>Du har klaret bane '+round+': '+CFG[round].name+'!</p><p>'+CFG[round+1].brief+'</p>',"NÆSTE BANE",()=>{round++;begin()});
}
function over(){
  running=false;music(0);
  if(score>best){best=score;try{localStorage.setItem("skyd-best",best)}catch(e){}}
  show('<h1>MAIN FRAME ER BRUDT!</h1><p>For mange AI-Agenter slap igennem. Din tidsregistrering i Ludus er væk – du er i flere års undertid.</p><p>Score: '+pad(score)+'<br>Rekord: '+pad(best)+'</p>',"SPIL IGEN",()=>newGame());
}

function sprite(rows,x,y,s,col,eye){
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){const k=rows[r][c];
    if(k==="."){continue}ctx.fillStyle=k==="E"?eye:col;ctx.fillRect(Math.round(x+c*s),Math.round(y+r*s),s,s)}
}
const PAL=[{bot:"#ff3df2",ship:"#39ff88",shot:"#ffd23f",hud:"#ffd23f",line:"#33e1ff"},
{bot:"#ffb000",ship:"#39ff88",shot:"#b8ffcc",hud:"#39ff88",line:"#39ff88"},
{bot:"#d5ffd9",ship:"#39ff88",shot:"#ffffff",hud:"#39ff88",line:"#39ff88"},
{bot:"#ffd6a0",ship:"#ff4d5e",shot:"#ffffff",hud:"#ff4d5e",line:"#ff4d5e"},
{bot:"#e8fbff",ship:"#33e1ff",shot:"#7df9ff",hud:"#7df9ff",line:"#33e1ff"}];
const pal=()=>PAL[space?0:Math.min(round,4)];
function theme(){const P=pal(),s=document.documentElement.style;s.setProperty("--amber",P.hud);s.setProperty("--cyan",P.line)}
const hh=(a,b)=>((a*73856093)^(b*19349663))>>>0;
function line(x0,y0,x1,y1){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke()}
function ball(x,y,rad,c,c2){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,rad,0,6.3);ctx.fill();ctx.fillStyle=c2;ctx.beginPath();ctx.arc(x-rad*.3,y-rad*.25,rad*.55,0,6.3);ctx.fill()}
function poly(pts,c,f){ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0]*W,q[1]*H*.8):ctx.moveTo(q[0]*W,q[1]*H*.8));ctx.closePath();ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.stroke()}

/* Bane 1: dæmpet, sløret kredsløb (tegnes i lav opløsning og skaleres op) */
let CIRC=null,CW=0,CH=0,PATHS=[];
function circuit(){
  if(CIRC&&CW===W&&CH===H)return CIRC;
  const w=Math.ceil(W/4),h=Math.ceil(H/4),c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d"),sx=W/w,sy=H/h;PATHS=[];x.fillStyle="#010a04";x.fillRect(0,0,w,h);x.lineCap="round";x.lineJoin="round";
  let s=12345;const rnd=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  for(let i=0;i<60;i++){
    let px=Math.floor(rnd()*w/4)*4,py=Math.floor(rnd()*h/4)*4;const pts=[[px,py]];
    x.strokeStyle="rgba(57,255,136,"+(.18+rnd()*.25)+")";x.lineWidth=1;x.beginPath();x.moveTo(px,py);
    for(let k=0,n=2+Math.floor(rnd()*3);k<n;k++){
      const len=(3+Math.floor(rnd()*8))*4,d=Math.floor(rnd()*4),dx=[1,0,-1,0][d]*len,dy=[0,1,0,-1][d]*len;
      px+=dx;py+=dy;x.lineTo(px,py);pts.push([px,py]);
      if(rnd()<.4){px+=4;py+=4;x.lineTo(px,py);pts.push([px,py])}
    }
    x.stroke();
    if(pts.length>2){const pp=pts.map(q=>[q[0]*sx,q[1]*sy]),ln=[];let tot=0;for(let j=0;j<pp.length-1;j++){const l=Math.hypot(pp[j+1][0]-pp[j][0],pp[j+1][1]-pp[j][1]);ln.push(l);tot+=l}PATHS.push({pts:pp,len:ln,tot})}
    x.fillStyle="rgba(57,255,136,.45)";x.beginPath();x.arc(px,py,1.6,0,6.3);x.fill();
  }
  for(let i=0;i<5;i++){const cx=Math.floor(rnd()*(w-16)),cy=Math.floor(rnd()*(h-12));
    x.strokeStyle="rgba(57,255,136,.35)";x.strokeRect(cx,cy,14,10);x.fillStyle="rgba(57,255,136,.06)";x.fillRect(cx,cy,14,10)}
  CIRC=c;CW=W;CH=H;return c;
}
function wopr(){
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(circuit(),0,0,W,H);
  ctx.fillStyle="rgba(1,10,4,.4)";ctx.fillRect(0,0,W,H);
  lights();
}
function pathPos(q,d){for(let i=0;i<q.len.length;i++){if(d<=q.len[i]){const a=q.pts[i],b=q.pts[i+1],f=q.len[i]?d/q.len[i]:0;return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}d-=q.len[i]}return q.pts[q.pts.length-1]}
/* ét rødt og ét blåt lys, der løber frem og tilbage gennem kredsløbet */
function lights(){
  const L=PATHS.slice().sort((a,b)=>b.tot-a.tot).slice(0,2);
  ctx.globalCompositeOperation="lighter";
  L.forEach((q,i)=>{
    const col=i?"70,140,255":"255,60,70",s=(T*(i?32:26)+i*q.tot*.6)%(2*q.tot),d=s<q.tot?s:2*q.tot-s;
    [[0,20,.95],[14,14,.45],[28,10,.2]].forEach(([back,rad,a])=>{
      const dd=Math.max(0,d-back*(s<q.tot?1:-1)),e=Math.min(q.tot,dd),[x,y]=pathPos(q,e),g=ctx.createRadialGradient(x,y,0,x,y,rad);
      g.addColorStop(0,"rgba("+col+","+a+")");g.addColorStop(1,"rgba("+col+",0)");ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)});
  });
  ctx.globalCompositeOperation="source-over";
}
/* Bane 2: faldende grøn kode */
const KANA="ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789";
function matrix(){
  ctx.fillStyle="#000a03";ctx.fillRect(0,0,W,H);
  ctx.font="14px monospace";ctx.textAlign="center";ctx.textBaseline="top";
  const n=Math.ceil(W/16),tick=Math.floor(T*5);
  for(let c=0;c<n;c++){
    const sp=40+hh(c,7)%90,len=8+hh(c,3)%14,head=(T*sp+hh(c,11)%(H+200))%(H+len*16+40);
    for(let k=0;k<len;k++){const y=head-k*16;if(y<-16||y>H)continue;
      ctx.globalAlpha=k?Math.max(.08,1-k/len)*.8:1;ctx.fillStyle=k?"#22ff66":"#e6fff0";
      ctx.fillText(KANA[hh(c+k*7,tick)%KANA.length],c*16+8,y)}
  }
  ctx.globalAlpha=1;
}
/* Bane 3: rødt robotsyn med sigtekorn og scanning */
function terminator(){
  const m=Math.min(W,H),p=10,L=26,cy=H*.45,g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  g.addColorStop(0,"#3b0707");g.addColorStop(1,"#0a0000");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.font="10px monospace";ctx.textAlign="left";ctx.textBaseline="top";ctx.fillStyle="rgba(255,77,94,.5)";
  for(let i=0;i<H/12+1;i++){const y=(((i*12-T*25)%(H+12))+H+12)%(H+12)-12;
    ctx.fillText(hh(i,1).toString(16).slice(0,8).toUpperCase(),8,y);ctx.fillText(hh(i,2).toString(16).slice(0,6).toUpperCase(),W-58,y)}
  ctx.strokeStyle="rgba(255,77,94,.8)";ctx.lineWidth=3;
  [[p,p,1,1],[W-p,p,-1,1],[p,H-p-22,1,-1],[W-p,H-p-22,-1,-1]].forEach(([x,y,a,b])=>{ctx.beginPath();ctx.moveTo(x+a*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+b*L);ctx.stroke()});
  ctx.strokeStyle="rgba(255,77,94,.35)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(W/2,cy,m*.22,0,6.3);ctx.stroke();
  line(W/2-m*.3,cy,W/2+m*.3,cy);line(W/2,cy-m*.3,W/2,cy+m*.3);
  const sy=(T*140)%(H+40)-20;ctx.fillStyle="rgba(255,77,94,.08)";ctx.fillRect(0,sy-30,W,30);ctx.fillStyle="rgba(255,77,94,.3)";ctx.fillRect(0,sy,W,3);
  ctx.fillStyle="rgba(255,130,130,.9)";ctx.font="11px monospace";
  ctx.fillText("SCANNER... MÅL FUNDET",p+34,p+6);ctx.fillText("MATCH "+(90+hh(Math.floor(T*3),5)%9)+"%",W-130,p+6);
}
/* Bane 4: svævende holografiske paneler */
function holo(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#04101c");g.addColorStop(1,"#0b2d4a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(125,249,255,.05)";[.2,.5,.8].forEach(u=>ctx.fillRect(u*W-1,0,2,H));
  [[.05,.1,.26,.3],[.36,.06,.3,.22],[.7,.12,.25,.3],[.12,.5,.3,.26],[.6,.52,.3,.24]].forEach((q,i)=>{
    const x=q[0]*W,y=q[1]*H+Math.sin(T*.8+i*1.7)*6,w=q[2]*W,h=q[3]*H,nb=6,bw=(w-20)/nb;
    ctx.fillStyle="rgba(125,249,255,.07)";ctx.fillRect(x,y,w,h);
    ctx.strokeStyle="rgba(150,235,255,.55)";ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);
    ctx.fillStyle="rgba(150,235,255,.5)";ctx.fillRect(x,y,w,14);
    ctx.fillStyle="rgba(200,245,255,.35)";ctx.fillRect(x+10,y+22,w*.5,3);ctx.fillRect(x+10,y+30,w*.3,3);
    for(let k=0;k<nb;k++){const bh=(.2+.7*Math.abs(Math.sin(T*.6+i*2+k*1.3)))*(h-46);ctx.fillStyle="rgba(125,249,255,.35)";ctx.fillRect(x+10+k*bw,y+h-8-bh,bw-6,bh)}
  });
}
function bg(){
  const k=space?0:Math.min(round,4),m=Math.min(W,H);
  for(const s of stars){s.y+=s.v/60;if(s.y>H){s.y=0;s.x=Math.random()*W}}
  if(k===1)wopr();else if(k===2)matrix();else if(k===3)terminator();else if(k===4)holo();
  else{
    ctx.fillStyle="#cfe8ff";
    for(const s of stars){ctx.globalAlpha=s.s===3?.9:.5;ctx.fillRect(s.x,s.y,s.s,s.s)}
    ctx.globalAlpha=1;
    const px1=W*.2,py1=H*.3,pr=m*.13;
    ball(px1,py1,pr,"#6d28d9","#8b5cf6");
    ctx.strokeStyle="#f0abfc";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(px1,py1,pr*1.75,pr*.4,-.4,0,6.3);ctx.stroke();
    ball(W*.83,H*.56,m*.07,"#b91c1c","#ef4444");
    ball(W*.6,H*.14,m*.03,"#94a3b8","#cbd5e1");
  }
  ctx.fillStyle=PAL[k].line;ctx.fillRect(0,H-22,W,3);ctx.globalAlpha=.15;ctx.fillRect(0,H-19,W,19);ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();
  const sl=Math.max(0,3-lives);
  if(sl){const g=ctx.createLinearGradient(0,H-110,0,H);g.addColorStop(0,"rgba(255,40,50,0)");g.addColorStop(1,"rgba(255,40,50,"+.1*sl+")");ctx.fillStyle=g;ctx.fillRect(0,H-110,W,110)}
  for(const g of glows){const a=Math.min(1,g.l),rad=110+(2-g.l)*50,gr=ctx.createRadialGradient(g.x,H-20,0,g.x,H-20,rad);
    gr.addColorStop(0,"rgba(255,40,50,"+.75*a+")");gr.addColorStop(1,"rgba(255,40,50,0)");ctx.fillStyle=gr;ctx.fillRect(g.x-rad,H-20-rad,rad*2,rad+20);
    ctx.fillStyle="rgba(255,70,80,"+.9*a+")";ctx.fillRect(g.x-90,H-22,180,4)}
  ctx.font=FONT;ctx.textAlign="center";ctx.textBaseline="middle";
  for(const b of bots){
    ctx.save();if(b.mode==="dust")ctx.globalAlpha=Math.max(0,1-b.m*1.1);
    if(b.mode==="breach"){ctx.beginPath();ctx.rect(0,0,W,H-22);ctx.clip()}
    const hx=b.x-22,hy=b.y;
    ctx.fillStyle=b.col;ctx.fillRect(Math.round(b.x-2),hy-10,4,10);
    ctx.fillRect(Math.round(b.x-4),hy-14,8,4);
    ctx.fillStyle="#0a0620";ctx.fillRect(Math.round(b.x-b.w/2),hy-38,b.w,26);
    ctx.strokeStyle=b.col;ctx.lineWidth=2;ctx.strokeRect(Math.round(b.x-b.w/2)+1,hy-37,b.w-2,24);
    ctx.fillStyle="#fff";ctx.fillText(b.t,b.x,hy-24);
    sprite(HEAD,hx,hy,4,b.col,(Math.floor(T*3)%2)?"#ff4d5e":"#ffd23f");ctx.restore();
  }
  ctx.fillStyle=pal().shot;for(const s of shots)ctx.fillRect(Math.round(s.x-2),s.y-8,4,16);
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}
  ctx.globalAlpha=1;
  sprite(SHIP,px-26,H-54,4,pal().ship);
  ctx.restore();
}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}

addEventListener("keydown",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(k==="m")toggleMute();
  if([" ","ArrowLeft","ArrowRight"].includes(k)&&ov.style.display==="none")e.preventDefault();keys[k]=true});
addEventListener("keyup",e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
function ptr(e){const r=cv.getBoundingClientRect();px=Math.max(30,Math.min(W-30,e.clientX-r.left))}
cv.addEventListener("pointerdown",e=>{ptr(e);fire()});
cv.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse"||e.buttons||true)ptr(e)});
$("fire").addEventListener("pointerdown",e=>{e.preventDefault();fire()});

["pointerdown","keydown"].forEach(ev=>addEventListener(ev,()=>{if(!musicT&&!muted)music(space?0:Math.min(round,4))}));
resize();hud("");intro();requestAnimationFrame(t=>{last=t;loop(t)});
</script>
